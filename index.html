<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rooster Fight Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }
        .text-stroke-2 { -webkit-text-stroke: 2px #000; }
        .text-stroke-1 { -webkit-text-stroke: 1px #000; }
        .btn-touch {
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-touch:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen w-screen flex flex-col justify-between items-center p-1 sm:p-2 overflow-hidden select-none">

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="absolute inset-0 bg-slate-950/98 flex flex-col items-center justify-center p-4 text-center z-50">
        <div class="bg-slate-900 border-4 border-amber-500/80 p-6 sm:p-8 rounded-3xl shadow-2xl max-w-md w-full flex flex-col gap-4">
            <h1 class="text-3xl sm:text-4xl font-black text-amber-400 tracking-wider text-stroke-2">🐓 ROOSTER ARENA 🐓</h1>
            <p class="text-xs sm:text-sm text-slate-300">ใส่รหัสห้องเดียวกันเพื่อรอเพื่อนเข้าประลอง</p>

            <div class="flex gap-2 justify-center">
                <button id="btn-mode-online" onclick="setGameMode('online')" class="px-4 py-2 bg-red-600 text-white font-black text-xs sm:text-sm rounded-xl border-2 border-yellow-300 shadow-lg cursor-pointer scale-105">
                    🌐 ห้องออนไลน์ (Online)
                </button>
                <button id="btn-mode-pve" onclick="setGameMode('pve')" class="px-4 py-2 bg-slate-800 text-slate-400 font-black text-xs sm:text-sm rounded-xl border-2 border-slate-700 shadow cursor-pointer">
                    🤖 เล่นกับบอท (vs AI)
                </button>
            </div>

            <div id="room-input-container" class="flex flex-col gap-2">
                <input type="text" id="room-input" placeholder="ใส่รหัสห้อง (เช่น room123)" class="bg-slate-950 border-2 border-amber-600/50 rounded-xl px-4 py-3 text-center text-xl font-bold text-amber-300 focus:outline-none focus:border-amber-400 shadow-inner">
            </div>

            <div id="bot-difficulty-container" class="flex flex-col items-center gap-1.5 hidden bg-slate-950 p-2.5 rounded-xl border border-indigo-500/40">
                <span class="text-xs font-bold text-indigo-300">เลือกระดับความยาก AI:</span>
                <div class="flex gap-2">
                    <button id="diff-easy" onclick="setDifficulty('easy')" class="px-3 py-1 bg-emerald-600 text-white font-black text-xs rounded-lg border border-white cursor-pointer shadow">🟢 ง่าย</button>
                    <button id="diff-normal" onclick="setDifficulty('normal')" class="px-3 py-1 bg-amber-600 text-white font-black text-xs rounded-lg border border-white cursor-pointer shadow opacity-60">🟡 ปานกลาง</button>
                    <button id="diff-hard" onclick="setDifficulty('hard')" class="px-3 py-1 bg-rose-600 text-white font-black text-xs rounded-lg border border-white cursor-pointer shadow opacity-60">🔴 ยากสุด</button>
                </div>
            </div>

            <button onclick="startMatch()" class="px-8 py-3 bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-white font-black text-lg sm:text-xl rounded-2xl border-4 border-yellow-300 shadow-xl transform active:scale-95 transition-transform cursor-pointer">
                ⚔️ เข้าสู่สนามประลอง ⚔️
            </button>
        </div>
    </div>

    <!-- TOP HUD -->
    <div class="w-full max-w-6xl bg-slate-900/90 rounded-2xl border-2 border-amber-500/50 p-2 flex justify-between items-center shadow-xl z-10 gap-2">
        <div class="flex-1 max-w-[42%] flex flex-col items-start gap-1">
            <div class="flex justify-between w-full items-center">
                <span class="text-red-400 font-black text-sm sm:text-xl tracking-wider text-stroke-1">🔴 P1 (ไก่แดง)</span>
                <span id="p1-combo" class="text-yellow-400 font-extrabold italic text-xs sm:text-base opacity-0 transition-opacity">COMBO x0</span>
            </div>
            <div class="w-full h-4 sm:h-6 bg-slate-950 rounded-full border-2 border-red-500 overflow-hidden relative">
                <div id="p1-hp" class="h-full bg-gradient-to-r from-red-600 to-amber-500 transition-all duration-75 w-full"></div>
                <span id="p1-hp-text" class="absolute inset-0 flex items-center justify-center text-xs font-black text-white text-stroke-1">250 / 250</span>
            </div>
            <div class="w-full h-2.5 bg-slate-950 rounded-full border border-cyan-500/50 overflow-hidden relative">
                <div id="p1-sp" class="h-full bg-cyan-400 transition-all duration-100 w-0"></div>
                <span id="p1-sp-text" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-slate-950">SP 0%</span>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center min-w-[60px] gap-0.5">
            <div id="timer" class="text-lg sm:text-2xl font-black text-amber-400 bg-slate-950 px-2.5 py-0.5 rounded-xl border-2 border-amber-500 text-stroke-1 shadow-inner">60</div>
            <button onclick="returnToHome()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-[9px] sm:text-xs rounded-lg border border-amber-500/50 cursor-pointer shadow">🏠 หน้าหลัก</button>
        </div>

        <div class="flex-1 max-w-[42%] flex flex-col items-end gap-1">
            <div class="flex justify-between w-full items-center">
                <span id="p2-combo" class="text-yellow-400 font-extrabold italic text-xs sm:text-base opacity-0 transition-opacity">COMBO x0</span>
                <span id="p2-title" class="text-blue-400 font-black text-sm sm:text-xl tracking-wider text-stroke-1">🔵 P2 (ไก่ฟ้า)</span>
            </div>
            <div class="w-full h-4 sm:h-6 bg-slate-950 rounded-full border-2 border-blue-500 overflow-hidden relative flex justify-end">
                <div id="p2-hp" class="h-full bg-gradient-to-l from-blue-600 to-cyan-400 transition-all duration-75 w-full"></div>
                <span id="p2-hp-text" class="absolute inset-0 flex items-center justify-center text-xs font-black text-white text-stroke-1">250 / 250</span>
            </div>
            <div class="w-full h-2.5 bg-slate-950 rounded-full border border-yellow-500/50 overflow-hidden relative flex justify-end">
                <div id="p2-sp" class="h-full bg-yellow-400 transition-all duration-100 w-0"></div>
                <span id="p2-sp-text" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-slate-950">SP 0%</span>
            </div>
        </div>
    </div>

    <!-- CANVAS & OVERLAYS -->
    <div class="relative w-full max-w-6xl flex-1 my-1 bg-slate-900 rounded-2xl border-2 sm:border-4 border-amber-600/80 overflow-hidden shadow-2xl flex items-center justify-center">
        <canvas id="gameCanvas" width="1024" height="576" class="w-full h-full object-contain"></canvas>

        <div id="waiting-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-4 text-center z-40 hidden">
            <h2 class="text-3xl sm:text-5xl font-black text-amber-400 mb-3 animate-pulse text-stroke-2">⏳ กำลังรอเพื่อนเข้าห้อง...</h2>
            <p id="room-code-display" class="text-sm sm:text-lg text-slate-300 mb-6 font-semibold">รหัสห้องของคุณ: -</p>
            <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-6"></div>
            <button onclick="returnToHome()" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow cursor-pointer">ยกเลิก / ออกจากห้อง</button>
        </div>

        <div id="countdown-overlay" class="absolute inset-0 bg-slate-950/80 flex flex-col items-center justify-center p-4 text-center z-40 hidden">
            <h2 id="countdown-text" class="text-6xl sm:text-9xl font-black text-amber-400 animate-bounce text-stroke-2">3</h2>
            <p class="text-xl sm:text-3xl text-white font-bold mt-4 text-stroke-1">เตรียมตัวประลองพร้อมกัน!</p>
        </div>

        <div id="gameover-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-4 text-center z-30 hidden">
            <h2 id="winner-text" class="text-3xl sm:text-6xl font-black text-amber-400 mb-2 text-stroke-2">WINNER!</h2>
            <p id="winner-sub" class="text-sm sm:text-xl text-slate-200 mb-6 font-semibold">สุดยอดไก่ชนผู้ครองสังเวียน!</p>
            <div class="flex gap-4">
                <button onclick="returnToHome()" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-black text-lg rounded-xl border-2 border-white shadow-lg active:scale-95 transition-transform cursor-pointer">🏠 กลับหน้า Lobby</button>
            </div>
        </div>
    </div>

    <!-- TOUCH CONTROLLER -->
    <div id="touch-panel" class="w-full max-w-xl flex items-center justify-around bg-slate-900/95 p-3 rounded-2xl border-2 border-amber-600/50 mb-1 shadow-2xl">
        <div class="relative w-32 h-32 bg-slate-950/80 rounded-2xl border border-amber-500/30 flex items-center justify-center shadow-inner">
            <button id="btn-touch-left" class="btn-touch absolute left-1 top-9 w-10 h-14 bg-slate-800 active:bg-slate-600 text-white font-black rounded-lg border border-slate-600 shadow flex items-center justify-center text-lg">◀</button>
            <button id="btn-touch-right" class="btn-touch absolute right-1 top-9 w-10 h-14 bg-slate-800 active:bg-slate-600 text-white font-black rounded-lg border border-slate-600 shadow flex items-center justify-center text-lg">▶</button>
            <button id="btn-touch-jump" class="btn-touch absolute top-1 left-9 w-14 h-10 bg-amber-600 active:bg-amber-500 text-white font-black rounded-lg border border-yellow-300 shadow flex items-center justify-center text-xs">▲โดด</button>
            <div class="w-8 h-8 rounded-full bg-slate-900 border border-slate-800"></div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-touch-block" class="btn-touch w-14 h-16 bg-slate-700 active:bg-slate-600 text-white font-black rounded-xl border-2 border-slate-300 shadow-lg flex flex-col items-center justify-center text-xs">🛡️<span class="text-[9px]">การ์ด</span></button>
            <button id="btn-touch-atk" class="btn-touch w-16 h-16 bg-red-600 active:bg-red-500 text-white font-extrabold rounded-full border-2 border-yellow-300 shadow-xl flex flex-col items-center justify-center text-base">🥊<span class="text-[10px]">ตี/เตะ</span></button>
            <button id="btn-touch-ult" class="btn-touch w-16 h-16 bg-cyan-600 active:bg-cyan-500 text-white font-extrabold rounded-full border-2 border-white shadow-xl flex flex-col items-center justify-center text-base">⚡<span class="text-[10px]">ไม้ตาย</span></button>
        </div>
    </div>

    <!-- SOCKET.IO & GAME SCRIPT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';
        let myRole = ''; 
        let gameMode = 'online';
        let botDifficulty = 'easy';
        let isMatchReady = false;

        function setGameMode(mode) {
            gameMode = mode;
            const onlineBtn = document.getElementById('btn-mode-online');
            const pveBtn = document.getElementById('btn-mode-pve');
            const roomInputC = document.getElementById('room-input-container');
            const botDiffC = document.getElementById('bot-difficulty-container');
            const p2Title = document.getElementById('p2-title');

            if (mode === 'online') {
                onlineBtn.className = "px-4 py-2 bg-red-600 text-white font-black text-xs sm:text-sm rounded-xl border-2 border-yellow-300 shadow-lg cursor-pointer scale-105";
                pveBtn.className = "px-4 py-2 bg-slate-800 text-slate-400 font-black text-xs sm:text-sm rounded-xl border-2 border-slate-700 shadow cursor-pointer";
                roomInputC.classList.remove('hidden');
                botDiffC.classList.add('hidden');
                p2Title.innerText = "🔵 P2 (ไก่ฟ้า)";
            } else {
                pveBtn.className = "px-4 py-2 bg-indigo-600 text-white font-black text-xs sm:text-sm rounded-xl border-2 border-yellow-300 shadow-lg cursor-pointer scale-105";
                onlineBtn.className = "px-4 py-2 bg-slate-800 text-slate-400 font-black text-xs sm:text-sm rounded-xl border-2 border-slate-700 shadow cursor-pointer";
                roomInputC.classList.add('hidden');
                botDiffC.classList.remove('hidden');
                p2Title.innerText = "🤖 P2 (AI BOT)";
            }
        }

        function setDifficulty(level) {
            botDifficulty = level;
            ['easy', 'normal', 'hard'].forEach(d => {
                const btn = document.getElementById(`diff-${d}`);
                if (d === level) {
                    btn.style.opacity = '1';
                    btn.classList.add('ring-2', 'ring-yellow-300');
                } else {
                    btn.style.opacity = '0.5';
                    btn.classList.remove('ring-2', 'ring-yellow-300');
                }
            });
        }

        class AudioSynth {
            constructor() { this.ctx = null; }
            init() { 
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            }
            playPeck() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
            playSwoosh() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playUlt() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
            playBlock() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
        }
        const audio = new AudioSynth();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_W = 1024;
        const CANVAS_H = 576;
        const GROUND_Y = 460;
        const GRAVITY = 0.65;

        const keyState = {};
        window.addEventListener('keydown', (e) => { keyState[e.code] = true; });
        window.addEventListener('keyup', (e) => { keyState[e.code] = false; });

        const touchInput = { left: false, right: false, jump: false, block: false, attack: false, ultimate: false };

        function bindTouchBtn(btnId, action) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const setVal = (val) => { touchInput[action] = val; };
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); setVal(true); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); setVal(false); });
            btn.addEventListener('pointerleave', (e) => { e.preventDefault(); setVal(false); });
        }

        bindTouchBtn('btn-touch-left', 'left');
        bindTouchBtn('btn-touch-right', 'right');
        bindTouchBtn('btn-touch-jump', 'jump');
        bindTouchBtn('btn-touch-block', 'block');
        bindTouchBtn('btn-touch-atk', 'attack');
        bindTouchBtn('btn-touch-ult', 'ultimate');

        class FeatherParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.7) * 10;
                this
